[package]
name = "slipstream-cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "slipstream"
path = "src/main.rs"

[lib]
name = "slipstream_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "2.3"
solana-sdk = "2.3"
